name: Tests and dependency health

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.25'
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Unit and regression tests (mock OS credentials)
        run: uv run --no-sync pytest -q
      - name: Dependency compatibility
        run: uv pip check
      - name: Desktop configuration
        run: uv run --no-sync python desktop/scripts/verify_desktop_config.py
      - name: Python syntax and whitespace
        run: |
          uv run --no-sync python -m compileall -q app desktop/sidecar_main.py
          git diff --check

  desktop-session-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test desktop/scripts/test-session.mjs
      - run: node --check app/static/app.js

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.25'
          python-version: '3.11'
      - run: uv sync --locked --extra dev --extra audit
      - run: uv run --no-sync pip-audit --skip-editable
